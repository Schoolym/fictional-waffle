<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortschatz 1–4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desktop" id="desktop">
  <div class="wall" aria-hidden="true"></div>

  <ul class="icons" id="icons" aria-label="Работен плот">
    <li><button class="dicon" data-open="cards"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="5" width="24" height="30" rx="2" fill="#fff" stroke="#3A5BA0"/><rect x="9" y="5" width="24" height="6" rx="1.5" fill="#2C6BE0"/><rect x="5" y="9" width="24" height="28" rx="2" fill="#fff" stroke="#3A5BA0"/><rect x="5" y="9" width="24" height="6" rx="1.5" fill="#0D4FD0"/><path d="M10 22h14M10 27h10" stroke="#1F4FBF" stroke-width="2.4" stroke-linecap="round"/></svg><span>Флашкарти</span></button></li>
    <li><button class="dicon" data-open="quiz"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="6" width="26" height="31" rx="2" fill="#F7F1DC" stroke="#8A6A2A"/><rect x="14" y="3" width="12" height="6" rx="2" fill="#B9B9B9" stroke="#666"/><path d="M12 16l2 2 4-4M12 25l2 2 4-4" stroke="#21A121" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M21 17h7M21 26h7" stroke="#555" stroke-width="2"/></svg><span>Тест</span></button></li>
    <li><button class="dicon" data-open="type"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="12" width="34" height="18" rx="3" fill="#E9E7DF" stroke="#777"/><g fill="#fff" stroke="#999"><rect x="6" y="15" width="5" height="4" rx="1"/><rect x="13" y="15" width="5" height="4" rx="1"/><rect x="20" y="15" width="5" height="4" rx="1"/><rect x="27" y="15" width="6" height="4" rx="1"/><rect x="6" y="21" width="5" height="4" rx="1"/><rect x="13" y="21" width="13" height="4" rx="1"/><rect x="28" y="21" width="5" height="4" rx="1"/></g></svg><span>Напиши</span></button></li>
    <li><button class="dicon" data-open="articles"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="7" width="22" height="9" rx="4.5" fill="#2B6BE0" stroke="#123E9A"/><rect x="9" y="17" width="22" height="9" rx="4.5" fill="#E0442B" stroke="#8E1E10"/><rect x="15" y="27" width="22" height="9" rx="4.5" fill="#3FA52A" stroke="#1E6012"/></svg><span>der · die · das</span></button></li>
    <li><button class="dicon" data-open="list"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 5h22a2 2 0 0 1 2 2v28H10a2 2 0 0 1-2-2z" fill="#B8352A" stroke="#6E1A12"/><path d="M10 31h22v4H10a2 2 0 0 1 0-4z" fill="#fff" stroke="#6E1A12"/><path d="M14 11h12M14 15h9" stroke="#F2C94C" stroke-width="2"/></svg><span>Речник</span></button></li>
    <li><button class="dicon" data-open="trash"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 12h22l-2 24H11z" fill="#C9D3DA" stroke="#5C6A73"/><rect x="7" y="8" width="26" height="5" rx="2" fill="#E3E9ED" stroke="#5C6A73"/><path d="M15 17l1 15M20 17v15M25 17l-1 15" stroke="#8796A0" stroke-width="1.6"/><path d="M17 23a4 4 0 0 1 6 0l-1 1.6M23 27a4 4 0 0 1-6 0" stroke="#21A121" stroke-width="2" fill="none"/></svg><span>Кошче</span></button></li>
  </ul>

  <section class="win opening" id="win" aria-labelledby="winTitle">
    <div class="titlebar" id="titlebar">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h10a1 1 0 0 1 1 1v11H3a1 1 0 0 1-1-1z" fill="#B8352A" stroke="#fff" stroke-width=".8"/><path d="M5 5h6M5 7.5h4" stroke="#F2C94C" stroke-width="1.2"/></svg>
      <h1 id="winTitle">Wortschatz – Флашкарти</h1>
      <div class="tbtns">
        <button class="tbtn" data-win="min" aria-label="Минимизирай"><svg viewBox="0 0 11 11" aria-hidden="true"><path d="M2 9h6"/></svg></button>
        <button class="tbtn" data-win="max" aria-label="Увеличи"><svg viewBox="0 0 11 11" aria-hidden="true"><rect x="1.5" y="1.5" width="8" height="8"/><path d="M1.5 2.5h8" stroke-width="3"/></svg></button>
        <button class="tbtn close" data-win="close" aria-label="Затвори"><svg viewBox="0 0 11 11" aria-hidden="true"><path d="M2 2l7 7M9 2l-7 7"/></svg></button>
      </div>
    </div>
    <div class="winbody">
      <div class="tabs" role="tablist" id="tabs" aria-label="Режим">
        <button role="tab" data-mode="cards"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="10" height="12" rx="1" fill="#fff" stroke="#3A5BA0"/><rect x="2" y="3" width="10" height="3" fill="#0D4FD0"/><rect x="5" y="1" width="9" height="11" rx="1" fill="none" stroke="#3A5BA0"/></svg>Флашкарти</button>
        <button role="tab" data-mode="quiz"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="10" height="13" rx="1" fill="#F7F1DC" stroke="#8A6A2A"/><path d="M5 7l1.5 1.5L9 6M5 11.5l1.5 1.5L9 10.5" stroke="#21A121" stroke-width="1.5" fill="none"/></svg>Тест</button>
        <button role="tab" data-mode="type"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="5" width="14" height="7" rx="1.5" fill="#E9E7DF" stroke="#777"/><path d="M3.5 7.5h1M6 7.5h1M8.5 7.5h1M11 7.5h1M5 10h6" stroke="#666" stroke-width="1.2"/></svg>Напиши</button>
        <button role="tab" data-mode="articles"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="9" height="4" rx="2" fill="#2B6BE0"/><rect x="3.5" y="6.5" width="9" height="4" rx="2" fill="#E0442B"/><rect x="6" y="11" width="9" height="4" rx="2" fill="#3FA52A"/></svg>der · die · das</button>
        <button role="tab" data-mode="list"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h9a1 1 0 0 1 1 1v12H4a1 1 0 0 1-1-1z" fill="#B8352A" stroke="#6E1A12" stroke-width=".8"/><path d="M5.5 4.5h5M5.5 6.5h3.5" stroke="#F2C94C" stroke-width="1.2"/></svg>Речник</button>
      </div>
      <div class="sheet" id="sheet">
        <details class="filterbox" id="filterbox" open><summary>Настройки: лекции, тема, посока</summary>
        <div class="filters" id="filters">
          <fieldset class="grp"><legend>Лекции</legend><div id="lessonChecks" style="display:contents"></div></fieldset>
          <fieldset class="grp"><legend>Тема</legend><select class="xsel" id="cat" aria-label="Тема"></select></fieldset>
          <fieldset class="grp" id="dir"><legend>Посока</legend>
            <label class="xcheck"><input type="radio" name="dir" value="de"> DE → BG</label>
            <label class="xcheck"><input type="radio" name="dir" value="bg"> BG → DE</label>
            <label class="xcheck"><input type="radio" name="dir" value="mix"> Смесено</label>
          </fieldset>
          <fieldset class="grp" id="hideWrap"><legend>Филтър</legend><label class="xcheck"><input type="checkbox" id="hideKnown"> Без научените</label></fieldset>
        </div></details>
        <p id="live" class="sr-only" aria-live="polite"></p>
        <main id="view" role="tabpanel" aria-label="Упражнение"></main>
      </div>
    </div>
    <div class="statusbar" id="statusbar">
      <span class="grow" id="stText">Готово</span>
      <span class="hide-sm" id="stLegend"></span>
      <span><span id="stPct">0%</span><span class="xpbar" style="width:110px;display:inline-block"><i id="stBar" style="width:0%"></i></span></span>
    </div>
  </section>
</div>

<div class="toasts" id="toasts" aria-hidden="true"></div>
<div id="modalRoot"></div>
<div class="balloon" id="balloon" role="status" hidden></div>

<nav class="smenu" id="smenu" hidden aria-label="Старт меню">
  <header><span class="avatar"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 4L2 10l12 6 12-6z" fill="#1E2F5A"/><path d="M7 13v6c0 2 3.5 3.5 7 3.5s7-1.5 7-3.5v-6l-7 3.5z" fill="#2D4B8C"/><path d="M24 11v7" stroke="#F2C94C" stroke-width="1.6"/></svg></span>Ученик</header>
  <div class="cols" role="menu" id="smenuItems">
    <div class="left">
      <button role="menuitem" data-open="cards"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="9" width="24" height="28" rx="2" fill="#fff" stroke="#3A5BA0"/><rect x="5" y="9" width="24" height="6" fill="#0D4FD0"/><rect x="11" y="4" width="24" height="28" rx="2" fill="none" stroke="#3A5BA0"/></svg><span><b>Флашкарти</b>Учи с обръщане</span></button>
      <button role="menuitem" data-open="quiz"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="6" width="26" height="31" rx="2" fill="#F7F1DC" stroke="#8A6A2A"/><path d="M12 16l2 2 4-4M12 25l2 2 4-4" stroke="#21A121" stroke-width="2.4" fill="none"/></svg><span><b>Тест</b>4 възможни отговора</span></button>
      <hr>
      <button role="menuitem" data-open="type"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="12" width="34" height="18" rx="3" fill="#E9E7DF" stroke="#777"/><path d="M8 18h3M15 18h3M22 18h3M29 18h3M13 24h14" stroke="#666" stroke-width="2.4"/></svg>Напиши</button>
      <button role="menuitem" data-open="articles"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="7" width="22" height="9" rx="4.5" fill="#2B6BE0"/><rect x="9" y="17" width="22" height="9" rx="4.5" fill="#E0442B"/><rect x="15" y="27" width="22" height="9" rx="4.5" fill="#3FA52A"/></svg>der · die · das</button>
      <button role="menuitem" data-open="list"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 5h22a2 2 0 0 1 2 2v28H10a2 2 0 0 1-2-2z" fill="#B8352A"/><path d="M14 11h12M14 15h9" stroke="#F2C94C" stroke-width="2"/></svg>Речник</button>
    </div>
    <div class="right">
      <button role="menuitem" data-menu="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4A6EB5"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#4A6EB5" stroke-width="1.8" fill="none"/></svg><span id="smSound">Звук: изкл</span></button>
      <button role="menuitem" data-menu="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2B71D9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5V14" stroke="#fff" stroke-width="2" fill="none"/><circle cx="12" cy="17.5" r="1.2" fill="#fff"/></svg>Клавишни комбинации</button>
      <hr>
      <button role="menuitem" data-open="trash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l-1.4 14H6.4z" fill="#C9D3DA" stroke="#5C6A73"/><rect x="4" y="4.5" width="16" height="3" rx="1" fill="#E3E9ED" stroke="#5C6A73"/></svg>Изпразни кошчето</button>
    </div>
  </div>
  <footer><button data-menu="close"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="#E0442B" stroke="#fff"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.2"/></svg>Затвори прозореца</button></footer>
</nav>

<footer class="taskbar">
  <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false" aria-controls="smenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z" fill="#B8352A" stroke="#fff" stroke-width="1.2"/><path d="M7.5 8h7M7.5 11h5" stroke="#F2C94C" stroke-width="1.6"/><circle cx="18.5" cy="17.5" r="4" fill="#F2C94C" stroke="#fff"/></svg>старт</button>
  <div class="tasks"><button class="task" id="taskBtn" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h10a1 1 0 0 1 1 1v11H3a1 1 0 0 1-1-1z" fill="#B8352A" stroke="#fff" stroke-width=".8"/></svg><span id="taskLabel">Wortschatz – Флашкарти</span></button></div>
  <div class="tray">
    <button id="soundBtn" aria-pressed="false" aria-label="Звук: изкл" title="Автоматично произношение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="#fff"/><path class="wave" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#fff" stroke-width="1.8" fill="none"/><path class="mute" d="M15 9l5 6M20 9l-5 6" stroke="#FF8A7A" stroke-width="2"/></svg></button>
    <span class="clock" id="clock" aria-label="Час">--:--</span>
  </div>
</footer>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
