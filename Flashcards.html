<!DOCTYPE html>
<html>
<head>
<title>Flashcards</title>
<link type="text/css" rel="stylesheet" href="CSS/firststyle.css">
</head>
<body>
        <nav>
<ul>
<li><a href="home.html">Home</a></li>
<li><a href="to-do.html">To-do list</a></li>
</ul>
        </nav> 
<h1>Flashcards</h1>
<p id="count"></p>
<button class="card" id="card" type="button"></button>
<div class="buttons">
  <button id="flip" type="button">Flip</button>
  <button id="shuffle" type="button">Shuffle</button>
  <button id="know" type="button">I know it</button>
  <button id="learning" type="button">Still learning</button>
</div>
<form id="addForm">
  <input id="front" placeholder="Front" required>
  <input id="back" placeholder="Back" required>
  <button type="submit">Add new</button>
</form>
<script>
(function(){
var cards=[{f:'Apple',b:'Apfel'},{f:'Thank you',b:'Danke'},{f:'Water',b:'Wasser'}];
var i=0,showBack=false,$=function(id){return document.getElementById(id)};
function render(){
  var el=$('card');
  if(!cards.length){el.textContent='No cards left. Add a new one below.';el.className='card';$('count').textContent='';return}
  if(i>=cards.length)i=0;
  el.textContent=showBack?cards[i].b:cards[i].f;
  el.className='card'+(showBack?' back':'');
  $('count').textContent='Card '+(i+1)+' of '+cards.length;
}
function flip(){showBack=!showBack;render()}
function next(){showBack=false;i=(i+1)%Math.max(cards.length,1);render()}
$('card').onclick=flip;$('flip').onclick=flip;
$('shuffle').onclick=function(){
  for(var a=cards.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=cards[a];cards[a]=cards[b];cards[b]=t}
  i=0;showBack=false;render();
};
$('know').onclick=function(){if(!cards.length)return;cards.splice(i,1);if(i>=cards.length)i=0;showBack=false;render()};
$('learning').onclick=function(){if(cards.length)next()};
$('addForm').onsubmit=function(e){
  e.preventDefault();
  cards.push({f:$('front').value.trim(),b:$('back').value.trim()});
  $('front').value='';$('back').value='';render();
};
render();
})();
</script>
</body>
</html>
